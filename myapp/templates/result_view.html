{% extends 'master/base.html' %}


{% block title %}
        ELearning | Result Board
{% endblock title %}
    

{% block content %}

<div class="container">
    <h1 class="text-center m-3">Result Dashboard</h1>

    <table class="table table-dark table-striped">

        <thead>
            <tr>
                <th>Learner's Name</th>
                <th>Marks</th>
                <th>Grade</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody>
                
                {% for data in r_data %}
                <tr>
                <td>{{data.student_name}}</td>
                <td>{{data.marks}}</td>
                <td>{{data.grade}}</td>
                <td>
                    <a href="{% url 'result_update' data.id %}" class="text-info">Edit</a>
                    <a href="{% url 'result_delete' data.id %}" class="text-danger">Remove</a>
                </td>
                </tr>
                {% endfor %}
        </tbody>

    </table>
    
</div>
    
{% endblock content %}
