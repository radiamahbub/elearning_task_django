{% extends 'master/base.html' %}


{% block title %}
        ELearning | Update Course Content
{% endblock title %}
    

{% block content %}

<div class="container">
    <h1 class="text-center m-3">Update Course Info Here</h1>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
    <div class="mb-3">
        <label for="exampleInputEmail1" class="form-label">Course Title</label>
        <input type="text" name="course_title" value="{{c_data.course_title}}" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
    </div>
    <div class="mb-3">
        <label for="exampleInputEmail1" class="form-label">Description</label>
        <textarea name="description" class="form-control" id="">{{c_data.description}}</textarea>
    </div>
    <div class="mb-3">
        <label for="exampleInputEmail1" class="form-label">Course Image</label>
                    {% if c_data.c_image %}
                        <img src="/{{c_data.c_image}}" width="100px" alt="">    
                    {% else %}
                        No preview    
                    {% endif %}
        <input type="file" name="c_image" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
    </div>
    <div class="d-grid gap-2">
    <button type="submit" class="btn btn-outline-primary text-primary">Submit</button>
    </div>
    </form>
</div>
    
{% endblock content %}
